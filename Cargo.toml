[package]
name = "fastdupfinder"
version = "1.0.0"
edition = "2021"
authors = ["FastDupFinder Contributors"]
description = "Blazing-fast duplicate file finder using two-pass detection (size pre-filter + SHA-256)"
license = "MIT"
repository = "https://github.com/fastdupfinder/fastdupfinder"
keywords = ["duplicate", "finder", "dedup", "sha256", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
walkdir = "2"
hex = "0.4"
indicatif = "0.17"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
serde_derive = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
